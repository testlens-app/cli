name: Build

on: [workflow_call]

permissions:
  contents: read

env:
  BUILD_CACHE_BUCKET: ${{ secrets.HETZNER_STORAGE_BUCKET }}
  BUILD_CACHE_ACCESS_KEY: ${{ secrets.HETZNER_STORAGE_ACCESS_KEY_ID }}
  BUILD_CACHE_SECRET_KEY: ${{ secrets.HETZNER_STORAGE_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: gradle/java-version.txt
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
          cache-read-only: false
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      - run: ./gradlew build
      - uses: ./.github/actions/open-test-reporting
        if: ${{ failure() }}
        with:
          display-name: Test Report
          file-name-suffix: build

  graalvm:
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    name: GraalVM Native Image (${{ matrix.os }})
    needs: build
    steps:
      - name: standardize git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version-file: gradle/java-version.txt
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      - run: ./gradlew nativeCompile
      - name: Smoke test native image
        run: build/native/nativeCompile/testlens --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlens-cli (${{ matrix.os }})
          path: build/native/nativeCompile/testlens*
          archive: false
          if-no-files-found: error

  dependency-submission:
    name: Dependency Submission
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: gradle/java-version.txt
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
