name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  graalvm:
    strategy:
      matrix:
        os:
          - runner: ubuntu
            label: linux
          - runner: macos
            label: macos
          - runner: windows
            label: windows
      fail-fast: false
    runs-on: ${{ matrix.os.runner }}-latest
    name: GraalVM Native Image (${{ matrix.os.label }})
    steps:
      - name: standardize git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version-file: gradle/java-version.txt
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
      - uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4
      - run: ./gradlew signReleaseArchive
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlens-${{ matrix.os.label }}
          path: build/release/**
          if-no-files-found: error

  create_release:
    needs: graalvm
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: testlens-*
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: testlens-*.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: true
          make_latest: true
          files: testlens-*
          tag_name: ${{ github.ref_name }}
